name: Fetch Latest CA File

on:
  schedule:
    # This will run daily at 00:00 UTC.
    - cron:  '0 0 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  fetch-ca-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Check out repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        # Credentials must persist so the inline `git push` below can authenticate.
        persist-credentials: true

    - name: Fetch the latest CA file
      run: |
        curl -O https://curl.se/ca/cacert.pem
        echo "Fetched the latest CA file."

    - name: Check if the CA file has changed
      id: cafile
      run: |
        CHANGED=$(git diff --name-only | grep cacert.pem || true)
        if [[ ! -z "$CHANGED" ]]; then
          echo "CHANGED=true" >> $GITHUB_ENV
        else
          echo "CHANGED=false" >> $GITHUB_ENV
        fi

    - name: Commit changes
      if: env.CHANGED == 'true'
      run: |
        git config --local user.email "srwiez@gmail.com"
        git config --local user.name "SRWieZ"
        git add cacert.pem
        git commit -m "Update CA file"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: fetch-ca-file
    if: needs.fetch-ca-file.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get the latest release
        id: latestrelease
        run: |
          LATEST_VERSION=$(curl --silent "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
          | jq -r .tag_name)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump the patch version
        id: bump
        run: |
          NEW_VERSION=$(echo "${{ steps.latestrelease.outputs.version }}" | awk -F. '{$NF = $NF + 1;} 1' | sed 's/ /./g')
          echo "VERSION=${NEW_VERSION}" >> $GITHUB_ENV

      - name: Create a new release
        id: create_release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v2.4.1
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          draft: true
          prerelease: false
