name: Fetch Latest CA File

on:
  schedule:
    # This will run daily at 00:00 UTC.
    - cron:  '0 0 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  fetch-ca-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.cafile.outputs.changed }}
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Credentials must persist so the inline `git push` below can authenticate.
        persist-credentials: true

    - name: Fetch the latest CA file
      run: |
        curl -O https://curl.se/ca/cacert.pem
        echo "Fetched the latest CA file."

    - name: Check if the CA file has changed
      id: cafile
      run: |
        if git diff --name-only | grep -q '^cacert\.pem$'; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Commit changes
      if: steps.cafile.outputs.changed == 'true'
      run: |
        git config --local user.email "srwiez@gmail.com"
        git config --local user.name "SRWieZ"
        git add cacert.pem
        git commit -m "Update CA file"
        git push

  release:
    needs: fetch-ca-file
    if: needs.fetch-ca-file.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get the latest release
        id: latestrelease
        run: |
          LATEST_VERSION=$(curl --silent "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
            | jq -r .tag_name)
          # Strip leading 'v' so the bumper below produces a clean semver.
          LATEST_VERSION=${LATEST_VERSION#v}
          echo "version=${LATEST_VERSION}" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump the patch version
        id: bump
        run: |
          NEW_VERSION=$(echo "${{ steps.latestrelease.outputs.version }}" | awk -F. '{$NF = $NF + 1;} 1' | sed 's/ /./g')
          echo "VERSION=${NEW_VERSION}" >> $GITHUB_ENV

      - name: Create a new release
        id: create_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2.4.1
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          draft: true
          prerelease: false
